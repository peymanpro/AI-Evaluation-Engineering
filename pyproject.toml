[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-evaluation-engineering"
version = "0.2.0"
description = "A provider-neutral engineering framework for evaluating, comparing, and regression-testing AI systems."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Peyman Salimi"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/peymanpro/AI-Evaluation-Engineering"
Repository = "https://github.com/peymanpro/AI-Evaluation-Engineering"
Issues = "https://github.com/peymanpro/AI-Evaluation-Engineering/issues"
Changelog = "https://github.com/peymanpro/AI-Evaluation-Engineering/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2"
]
openai = [
  "openai>=1.60,<4"
]

[project.scripts]
ai-eval-demo = "ai_eval_engineering.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
