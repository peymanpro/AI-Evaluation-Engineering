name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version to publish; must match pyproject.toml"
        required: false
        type: string
      publish_pypi:
        description: "Publish the built distributions to PyPI using a configured Trusted Publisher"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, build, and publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve and validate release source
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH_PYPI: ${{ inputs.publish_pypi }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag="v$project_version"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [[ "$REF_TYPE" != "tag" && "$INPUT_PUBLISH_PYPI" != "true" ]] && git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Version tag $tag already exists. A branch update will not republish that tag; increment the project version for the next release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "version=$project_version" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$REF_TYPE" == "tag" ]]; then
            [[ "$REF_NAME" == "$tag" ]] || { echo "Tag $REF_NAME must match $tag." >&2; exit 1; }
          elif git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            git checkout --detach "$tag"
            project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            [[ "v$project_version" == "$tag" ]] || { echo "Tag version mismatch." >&2; exit 1; }
          fi
          [[ "$project_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected MAJOR.MINOR.PATCH." >&2; exit 1; }
          [[ -z "$INPUT_VERSION" || "$INPUT_VERSION" == "$project_version" ]] || { echo "Requested version does not match pyproject.toml." >&2; exit 1; }
          echo "version=$project_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$project_version" >> "$GITHUB_OUTPUT"
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install package, developer tools, and the optional judge SDK
        if: steps.version.outputs.skip != 'true'
        run: python -m pip install --upgrade pip && pip install -e ".[dev,openai]"

      - name: Tests
        if: steps.version.outputs.skip != 'true'
        run: pytest

      - name: Ruff
        if: steps.version.outputs.skip != 'true'
        run: ruff check .

      - name: Mypy
        if: steps.version.outputs.skip != 'true'
        run: mypy src

      - name: Verify optional OpenAI SDK initialization without a network call
        if: steps.version.outputs.skip != 'true'
        run: |
          python -c 'from ai_eval_engineering import AsyncOpenAICompatibleJudge, OpenAICompatibleJudge; sync_judge = OpenAICompatibleJudge(model="package-smoke-test", api_key="test-only-key", base_url="http://127.0.0.1:1"); async_judge = AsyncOpenAICompatibleJudge(model="package-smoke-test", api_key="test-only-key", base_url="http://127.0.0.1:1"); assert sync_judge._client is not None and async_judge._client is not None; print("Optional sync and async OpenAI SDK initialization passed.")'

      - name: Verify demonstrations
        if: steps.version.outputs.skip != 'true'
        run: |
          ai-eval --help
          ai-eval schema > "$RUNNER_TEMP/external-run-v1.schema.json"
          ai-eval suite-schema > "$RUNNER_TEMP/evaluation-suite-v1.schema.json"
          ai-eval validate-suite examples/suites/support-smoke-v1.json
          ai-eval-demo
          python examples/online_experiment.py
          python examples/security_regression.py
          python examples/tradeoffs.py
          python examples/integrations.py
          python examples/promptfoo_release_workflow.py
          python examples/reserved_budget.py
          python examples/async_evaluation.py
          python examples/deterministic_graders.py
          python examples/retry_policy.py
          python examples/structured_composite_graders.py
          python examples/failure_aware_evaluation.py

      - name: Build and validate distributions
        if: steps.version.outputs.skip != 'true'
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*

      - name: Upload distributions for the PyPI job
        if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Verify wheel can be installed
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/wheel-install"
          python -m pip install --no-deps --target "$install_dir" dist/*.whl
          (
            cd "$RUNNER_TEMP"
            PYTHONPATH="$install_dir" python -c 'import importlib.metadata as metadata; import ai_eval_engineering; dist = metadata.distribution("ai-evaluation-engineering"); assert dist.version == "0.3.0"; assert dist.metadata.get("License-Expression") == "MIT"; assert any(str(path).endswith("LICENSE") for path in (dist.files or [])); assert hasattr(ai_eval_engineering, "OpenAICompatibleJudge"); assert ai_eval_engineering.get_external_run_schema()["properties"]["schema_version"]["const"] == 1; print("Built wheel version/license/API/schema smoke test passed.")'
          )

      - name: Publish GitHub Release if not already published
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ steps.version.outputs.target_sha }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; no duplicate will be created."
            exit 0
          fi
          if [[ "$REF_TYPE" == "tag" ]] || git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" dist/* --verify-tag --repo "$GH_REPO" \
              --title "AI Evaluation Engineering $RELEASE_TAG" --generate-notes
          else
            gh release create "$RELEASE_TAG" dist/* --target "$TARGET_SHA" --repo "$GH_REPO" \
              --title "AI Evaluation Engineering $RELEASE_TAG" --generate-notes
          fi

  publish-pypi:
    name: Publish distributions to PyPI
    needs: release
    # PyPI stays opt-in during feature development; a push/tag never publishes it.
    if: >-
      needs.release.result == 'success' &&
      needs.release.outputs.skip != 'true' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_pypi == true
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ai-evaluation-engineering/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
