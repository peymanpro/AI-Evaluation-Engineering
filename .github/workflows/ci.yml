name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Smoke-test optional synchronous and asynchronous OpenAI SDK clients
        run: |
          python -m pip install ".[openai]"
          python -c 'from ai_eval_engineering import AsyncOpenAICompatibleJudge, OpenAICompatibleJudge; sync_judge = OpenAICompatibleJudge(model="ci-smoke-model", api_key="test-only-key", base_url="http://127.0.0.1:1"); async_judge = AsyncOpenAICompatibleJudge(model="ci-smoke-model", api_key="test-only-key", base_url="http://127.0.0.1:1"); assert sync_judge._client is not None and async_judge._client is not None; print("Optional sync and async OpenAI SDK initialization passed without network calls.")'
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Evaluation CLI help
        run: ai-eval --help
      - name: Evaluation CLI schema
        run: ai-eval schema > /tmp/external-run-v1.schema.json && python -c 'import json; schema=json.load(open("/tmp/external-run-v1.schema.json", encoding="utf-8")); assert schema["properties"]["schema_version"]["const"] == 1'
      - name: Evaluation suite schema
        run: |
          ai-eval suite-schema > /tmp/evaluation-suite-v1.schema.json
          python -c 'import json; schema=json.load(open("/tmp/evaluation-suite-v1.schema.json", encoding="utf-8")); assert schema["properties"]["schema_version"]["const"] == 1'
          ai-eval validate-suite examples/suites/support-smoke-v1.json
      - name: Release policy schema and sample policy
        run: |
          ai-eval release-policy-schema > /tmp/release-policy-v1.schema.json
          python -c 'import json; schema=json.load(open("/tmp/release-policy-v1.schema.json", encoding="utf-8")); assert schema["properties"]["schema_version"]["const"] == 1; assert schema["$defs"]["policy"]["properties"]["metrics"]["minItems"] == 1'
          python -c 'from ai_eval_engineering import load_release_policy_json; policy=load_release_policy_json("examples/policies/quality-latency-safety-v1.json"); assert len(policy.metrics) == 3; print("Three-metric release policy validated.")'
      - name: Execution report schema
        run: python -c 'from ai_eval_engineering import get_execution_report_schema; schema=get_execution_report_schema(); assert schema["properties"]["schema_version"]["const"] == 1; assert schema["$defs"]["caseExecution"]["additionalProperties"] is False'
      - name: Core demo
        run: ai-eval-demo
      - name: Reserved budget demo
        run: python examples/reserved_budget.py
      - name: Online evaluation demo
        run: python examples/online_experiment.py
      - name: Security regression demo
        run: python examples/security_regression.py
      - name: Trade-off demo
        run: python examples/tradeoffs.py
      - name: Integration contract demo
        run: python examples/integrations.py
      - name: Promptfoo release workflow demo
        run: python examples/promptfoo_release_workflow.py
      - name: Async evaluation demo
        run: python examples/async_evaluation.py
      - name: Deterministic graders demo
        run: python examples/deterministic_graders.py
      - name: Retry policy demo
        run: python examples/retry_policy.py
      - name: Structured and composite graders demo
        run: python examples/structured_composite_graders.py
      - name: Failure-aware evaluation report demo
        run: python examples/failure_aware_evaluation.py

  package:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build and validate distributions
        run: |
          python -m build
          twine check dist/*
      - name: Verify built wheel metadata, license, API, and schemas
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/wheel-install"
          python -m pip install --no-deps --target "$install_dir" dist/*.whl
          (
            cd "$RUNNER_TEMP"
            PYTHONPATH="$install_dir" python -c 'import importlib.metadata as metadata; import ai_eval_engineering; dist = metadata.distribution("ai-evaluation-engineering"); assert dist.version == "0.3.0"; assert dist.metadata.get("License-Expression") == "MIT"; assert any(str(path).endswith("LICENSE") for path in (dist.files or [])); assert hasattr(ai_eval_engineering, "OpenAICompatibleJudge"); assert ai_eval_engineering.get_external_run_schema()["properties"]["schema_version"]["const"] == 1; print("Built wheel version/license/API/schema smoke test passed.")'
          )
