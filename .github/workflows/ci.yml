name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Core demo
        run: ai-eval-demo
      - name: Security regression demo
        run: python examples/security_regression.py
      - name: Trade-off demo
        run: python examples/tradeoffs.py
      - name: Integration contract demo
        run: python examples/integrations.py
