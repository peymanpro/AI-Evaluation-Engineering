name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Smoke-test optional synchronous and asynchronous OpenAI SDK clients
        run: |
          python -m pip install ".[openai]"
          python -c 'from ai_eval_engineering import AsyncOpenAICompatibleJudge, OpenAICompatibleJudge; sync_judge = OpenAICompatibleJudge(model="ci-smoke-model", api_key="test-only-key", base_url="http://127.0.0.1:1"); async_judge = AsyncOpenAICompatibleJudge(model="ci-smoke-model", api_key="test-only-key", base_url="http://127.0.0.1:1"); assert sync_judge._client is not None and async_judge._client is not None; print("Optional sync and async OpenAI SDK initialization passed without network calls.")'
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Evaluation CLI help
        run: ai-eval --help
      - name: Evaluation CLI schema
        run: ai-eval schema > /tmp/external-run-v1.schema.json && python -c 'import json; schema=json.load(open("/tmp/external-run-v1.schema.json", encoding="utf-8")); assert schema["properties"]["schema_version"]["const"] == 1'
      - name: Evaluation suite schema
        run: |
          ai-eval suite-schema > /tmp/evaluation-suite-v1.schema.json
          python -c 'import json; schema=json.load(open("/tmp/evaluation-suite-v1.schema.json", encoding="utf-8")); assert schema["properties"]["schema_version"]["const"] == 1'
          ai-eval validate-suite examples/suites/support-smoke-v1.json
      - name: Core demo
        run: ai-eval-demo
      - name: Online evaluation demo
        run: python examples/online_experiment.py
      - name: Security regression demo
        run: python examples/security_regression.py
      - name: Trade-off demo
        run: python examples/tradeoffs.py
      - name: Integration contract demo
        run: python examples/integrations.py
      - name: Promptfoo release workflow demo
        run: python examples/promptfoo_release_workflow.py
      - name: Async evaluation demo
        run: python examples/async_evaluation.py
      - name: Deterministic graders demo
        run: python examples/deterministic_graders.py
